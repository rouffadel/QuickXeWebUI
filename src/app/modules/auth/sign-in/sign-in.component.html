<div
    class="flex min-w-0 flex-auto flex-col items-center sm:flex-row sm:justify-center md:items-start md:justify-start"
>

<div
class="w-full h-full px-4 py-8 bg-[#303030] sm:bg-card   sm:rounded-2xl sm:p-12 sm:shadow md:flex md:h-full md:items-center md:justify-center  md:rounded-none md:p-16 md:shadow-none"
>
    <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">
        <div class="flex justify-center items-center">
        <div class="w-50">
            <!-- <img src="images/logo/QuickXe_logo.jpeg" /> -->

            <img src="images/logo/quickxe_white.png" />
            <!-- <img src="images/logo/QuickXe_Nbg.png" /> -->
        </div>
    </div>
        <!-- Title -->
        <div
            class="mt-2 flex w-full justify-center text-white text-3xl ml-2 items-center font-semibold leading-tight tracking-tight"
        >
            Sign in
        </div>
        

        <!-- Sign in form -->
        <form class="mt-4" [formGroup]="signInForm" #signInNgForm="ngForm">

            <!-- Username field -->
                <mat-form-field class="w-full">
                    <mat-label class="text-white">Email address</mat-label>
                    <input id="username" matInput [formControlName]="'username'" />
                    <mat-error *ngIf="signInForm.get('username').hasError('required')">
                        Email is required
                    </mat-error>
                </mat-form-field>


            <!-- Password field -->
            <mat-form-field class="w-full">
                <mat-label class="text-white" >Password</mat-label>
                <input
                    id="password"
                    matInput
                    type="password"
                    [formControlName]="'password'"
                    #passwordField
                />
                <button
                    mat-icon-button
                    type="button"
                    (click)="
                        passwordField.type === 'password'
                            ? (passwordField.type = 'text')
                            : (passwordField.type = 'password')
                    "
                    matSuffix
                >
                    @if (passwordField.type === 'password') {
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:eye'"
                        ></mat-icon>
                    }
                    @if (passwordField.type === 'text') {
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:eye-slash'"
                        ></mat-icon>
                    }
                </button>
                <mat-error> Password is required </mat-error>
            </mat-form-field>

            <div *ngIf="invalidCredentials" class="error-message" style="color: red;">
                {{ invalidCredentials }}
            </div>

            <!-- Actions -->
            <div
                    class="mt-1.5 inline-flex w-full items-center justify-between"
                >
                    <a
                        class="text-md font-large text-white hover:underline"
                        [routerLink]="['/forgot-password']"
                        >Forgot password?
                    </a>
                </div>

            <!-- Submit button -->
            <button
                class="fuse-mat-button-large btn-color mt-6 w-full" style="background-color: #ffb300;"
                mat-flat-button
                [disabled]="signInForm.disabled"
                (click)="signIn()"
            >
                @if (!signInForm.disabled) {
                    <span> Sign in </span>
                }
                @if (signInForm.disabled) {
                    <mat-progress-spinner
                        [diameter]="24"
                        [mode]="'indeterminate'"
                    ></mat-progress-spinner>
                }
            </button>

        </form>
    </div>
</div>
