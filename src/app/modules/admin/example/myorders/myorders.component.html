<div class="flex min-w-0 flex-auto flex-col">
  <!-- Main -->
  <div class="flex-auto p-6 sm:p-10">

    <div class="search-container">
      <mat-form-field class="search-field">
        <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" placeholder="Search">
      </mat-form-field>
    </div>

    <!-- CONTENT GOES HERE -->
    <div class="responsive-table-wrapper">
      <table mat-table [dataSource]="filteredData" class="mat-elevation-z8" style="max-height: 400px; overflow: auto;">

        <ng-container matColumnDef="orderId">
          <th class="sticky-header" mat-header-cell *matHeaderCellDef
            style="background-color: #424242;color: white; text-align: left;">
            <span style="vertical-align: middle;">ID</span> <!-- Order ID aligned to middle -->
          </th>
          <td mat-cell *matCellDef="let element" style="text-align: left;">
            <div class="order-wrapper">
              <div class="order-info">
                <span class="order-text">{{ element.orderId }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th class="sticky-header" mat-header-cell *matHeaderCellDef
            style="background-color: #424242;color: white; text-align: left;">
            <span style="vertical-align: middle;">Name</span>
          </th>
          <td mat-cell *matCellDef="let element" style="text-align: left;">
            <span class="order-text">{{ element.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="country">
          <th class="sticky-header" mat-header-cell *matHeaderCellDef
            style="background-color: #424242;color: white; text-align: left;">
            <span style="vertical-align: middle;">Currency</span>
          </th>
          <td mat-cell *matCellDef="let element" style="text-align: left;">
            <div class="country-wrapper">
              <div class="country-info">
                <span class="country-text">{{ element.fromCurrency }} <mat-icon
                    class="icon-size-4">arrow_forward</mat-icon> {{ element.toCurrency }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th class="sticky-header" mat-header-cell *matHeaderCellDef
            style="background-color: #424242;color: white; text-align: left;">
            <span style="vertical-align: middle;">Amount</span> <!-- Order ID aligned to middle -->
          </th>
          <td mat-cell *matCellDef="let element" style="text-align: left;">
            <div class="order-wrapper">
              <div class="order-info">
                <span class="order-text">{{ element.amount }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- City Column -->
        <ng-container matColumnDef="city">
          <th class="sticky-header" mat-header-cell *matHeaderCellDef
            style="background-color: #424242;color: white; text-align: left;">
            <span style="vertical-align: middle;">City</span>
          </th>
          <td mat-cell *matCellDef="let element" style="text-align: left;">
            <span class="order-text">{{ element.city }}</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
