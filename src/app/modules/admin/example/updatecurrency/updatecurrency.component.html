<div class="-m-6 flex max-h-screen max-w-240 flex-col md:min-w-160">
    <!-- Header -->
    <div class="flex h-16 flex-0 items-center justify-between bg-[#424242] pl-6 pr-3 text-on-primary sm:pl-8 sm:pr-5">
        <div class="text-lg font-medium">Update Currency</div>
        <br>
        <button mat-icon-button (click)="Close()" [tabIndex]="-1">
            <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </div>

    <!-- Content -->
    <div class="flex flex-auto flex-col overflow-y-auto p-6 sm:p-8">
        <!-- <mat-form-field>
            <mat-select [(ngModel)]="country" name="country" (selectionChange)="Change($event)" aria-placeholder="Add">
                <mat-option *ngFor="let item of currency" [value]="item">{{ item.countryName }}</mat-option>
            </mat-select>
        </mat-form-field> -->

        <mat-form-field>
            <mat-label>Country</mat-label>
            <input matInput [(ngModel)]="selcountryName" disabled />
        </mat-form-field>

        <!-- <mat-form-field>
            <mat-select [(ngModel)]="selcountryName" (selectionChange)="Change($event)" aria-placeholder="Add">
              <mat-option *ngFor="let item of currency" [value]="item.countryName">
                {{ item.countryName }}
              </mat-option>
            </mat-select>
          </mat-form-field> -->


        <div class="flex flex-col mt-2 space-y-2">
            <div class="flex items-center">
                <span>Currency Symbol :&nbsp;</span>
                <span class="font-bold text-lg">{{ currencySymbol }}</span>
            </div>

            <div class="flex items-center">
                <span>Flag :&nbsp;</span>
                <img src="/assets/icons/globe.png" alt="" *ngIf="!selcountryCode"
                    class="h-6 w-10 object-cover rounded shadow-sm" />
                <img [src]="'https://flagcdn.com/w40/' + selcountryCode + '.png'" alt="{{ selcountryCode }} flag"
                    class="h-6 w-10 object-cover rounded shadow-sm country-flag" *ngIf="selcountryCode" />
            </div>

            <div class="text-right">
                Currency Name: <span class="font-bold">{{ selcurrencyName }}</span>
            </div>
        </div>

        <mat-form-field>
            <mat-label>Buy Rate</mat-label>
            <input matInput type="number" [(ngModel)]="inputBuyRate" (keypress)="onlyNumbers($event)" />
        </mat-form-field>

        <mat-form-field>
            <mat-label>Sell Rate</mat-label>
            <input matInput type="number" [(ngModel)]="inputSellRate" (keypress)="onlyNumbers($event)" />
        </mat-form-field>
    </div>

    <!-- Actions -->
    <div class="mt-4 flex items-center justify-end mb-4 mr-4 sm:mt-0">



        <!-- <button
(click)="addCurrency()"
[ngStyle]="{'background-color': (!country || !buyRate || !sellRate) ? 'bg-gray' : '#ffb300', 'color': (!country || !buyRate || !sellRate) ? 'inherit' : 'white' }"
class="order-first sm:order-last"
mat-flat-button
[disabled]="!country || !buyRate || !sellRate"
>
Save
</button> -->

        <button (click)="updateCurrency()" mat-flat-button [disabled]="!inputBuyRate || !inputSellRate"
            [ngStyle]="{ 'background-color': (inputBuyRate && inputSellRate)  ? '#ffb300' : '' }"
            class="order-first sm:order-last">
            Update
        </button>
    </div>
</div>
