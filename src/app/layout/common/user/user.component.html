<!-- Button -->
<button mat-icon-button [matMenuTriggerFor]="userActions">
    <span class="relative">
        <mat-icon class="icon-size-10 text-primary" [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    </span>
</button>

<mat-menu [xPosition]="'before'" #userActions="matMenu" class="user-menu-panel">
    <!-- Header with User Name -->
    <div class="px-6 py-5 bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700"
        style="min-width: 260px;">
        <div class="flex flex-col leading-none">
            <span class="text-secondary text-xs font-bold uppercase tracking-widest opacity-60">Signed in as</span>
            <span class="mt-2 text-lg font-bold text-gray-900 dark:text-gray-100">{{userName}}</span>
        </div>
    </div>

    <!-- Menu Items -->
    <div class="p-2">
        <button mat-menu-item (click)="openUpdateProfileForm()"
            class="hover:bg-primary-50 dark:hover:bg-primary-900/10 transition-colors duration-150 rounded-md">
            <div class="flex items-center py-1">
                <mat-icon class="icon-size-5 mr-4 text-primary" [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
                <span class="font-semibold text-md">Profile</span>
            </div>
        </button>

        @if (!isCustomer) {
        <button mat-menu-item (click)="changePassword()"
            class="hover:bg-primary-50 dark:hover:bg-primary-900/10 transition-colors duration-150 rounded-md">
            <div class="flex items-center py-1">
                <mat-icon class="icon-size-5 mr-4 text-primary" [svgIcon]="'heroicons_outline:lock-closed'"></mat-icon>
                <span class="font-semibold text-md">Change Password</span>
            </div>
        </button>
        }

        <!-- Spacing gap with a subtle divider -->
        <mat-divider class="my-2 opacity-40"></mat-divider>

        <button mat-menu-item (click)="signOut()"
            class="hover:bg-red-50 dark:hover:bg-red-900/10 group transition-colors duration-150 rounded-md">
            <div class="flex items-center py-1">
                <mat-icon class="icon-size-5 mr-4 text-red-500 group-hover:text-red-600"
                    [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
                <span class="font-semibold text-md text-red-600 group-hover:text-red-700">Sign out</span>
            </div>
        </button>
    </div>
</mat-menu>
